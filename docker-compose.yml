name: numismatist

services:
  numismatist_api:
    build:
      context: backend
    env_file:
      - backend/.env
    command:
      sh -c "granian --interface asgi api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8099:8000"
    volumes:
      - ./backend/src:/app
      - ./backend/pyproject.toml:/app/pyproject.toml
    depends_on:
      numismatist_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - numismatist_net

  numismatist_migrations:
    build:
      context: backend
    env_file:
      - backend/.env
    profiles: [ "tools" ]
    volumes:
      - ./backend/src:/app
      - ./backend/pyproject.toml:/app/pyproject.toml
    depends_on:
      numismatist_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - numismatist_net

  numismatist_dev_tools:
    build:
      context: backend
    env_file:
      - backend/.env
    profiles: [ "tools" ]
    volumes:
      - ./backend/src:/app
      - ./backend/pyproject.toml:/app/pyproject.toml
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - numismatist_net

  numismatist_frontend:
    build:
      context: frontend
    env_file:
      - frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - numismatist_net

  numismatist_db:
    image: postgres:17.2-alpine3.20
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: backend_pg_user
      POSTGRES_PASSWORD: backend_pg_password
      POSTGRES_DB: backend_pg_database
    ports:
      - "5437:5432"
    volumes:
      - numismatist_pg-data:/var/lib/postgres/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d backend_pg_database -U backend_pg_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - numismatist_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - numismatist_minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - numismatist_net

  numismatist_minio_setup:
    image: minio/mc:latest
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    network_mode: "service:minio"
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;
      echo 'Setting up MinIO alias...';
      mc alias set minio http://localhost:9000 minioadmin minioadmin;
      echo 'Creating bucket...';
      mc mb minio/numismatist --ignore-existing;
      echo 'Setting bucket policy...';
      mc anonymous set public minio/numismatist;
      echo 'Listing buckets to verify...';
      mc ls minio/;
      echo 'MinIO bucket setup complete';
      "

volumes:
  numismatist_pg-data:
  numismatist_minio-data:

networks:
  numismatist_net: